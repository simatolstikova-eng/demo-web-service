<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Шапка -->
        <header class="header">
            <div class="header-content">
                <h1>🚀 Demo Web Service</h1>
                <div class="header-user">
                    <span id="userName">Администратор</span>
                    <button onclick="logout()" class="btn btn-danger btn-sm">Выйти</button>
                </div>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Статистика -->
            <section class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-info">
                            <h3 id="totalClients">0</h3>
                            <p>Клиентов</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📦</div>
                        <div class="stat-info">
                            <h3 id="totalProducts">0</h3>
                            <p>Товаров</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">✅</div>
                        <div class="stat-info">
                            <h3 id="activeClients">0</h3>
                            <p>Активных клиентов</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Клиенты -->
            <section class="table-section">
                <div class="section-header">
                    <h2>👥 Клиенты</h2>
                    <button onclick="showAddClientModal()" class="btn btn-primary">+ Добавить</button>
                </div>
                <div class="table-container">
                    <table id="clientsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Имя пользователя</th>
                                <th>Email</th>
                                <th>Полное имя</th>
                                <th>Телефон</th>
                                <th>Роль</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="clientsTableBody">
                            <tr><td colspan="7" class="text-center">Загрузка...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Товары -->
            <section class="table-section">
                <div class="section-header">
                    <h2>📦 Товары</h2>
                    <button onclick="showAddProductModal()" class="btn btn-primary">+ Добавить</button>
                </div>
                <div class="table-container">
                    <table id="productsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Описание</th>
                                <th>Цена</th>
                                <th>Количество</th>
                                <th>Категория</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <tr><td colspan="7" class="text-center">Загрузка...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Модальное окно для клиента -->
    <div id="clientModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('clientModal')">&times;</span>
            <h2 id="clientModalTitle">Добавить клиента</h2>
            <form id="clientForm">
                <input type="hidden" id="clientId">
                <div class="form-group">
                    <label for="clientUsername">Имя пользователя</label>
                    <input type="text" id="clientUsername" required>
                </div>
                <div class="form-group">
                    <label for="clientEmail">Email</label>
                    <input type="email" id="clientEmail" required>
                </div>
                <div class="form-group">
                    <label for="clientFullName">Полное имя</label>
                    <input type="text" id="clientFullName" required>
                </div>
                <div class="form-group">
                    <label for="clientPhone">Телефон</label>
                    <input type="text" id="clientPhone">
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно для товара -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('productModal')">&times;</span>
            <h2 id="productModalTitle">Добавить товар</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label for="productName">Название</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label for="productDescription">Описание</label>
                    <textarea id="productDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="productPrice">Цена</label>
                    <input type="number" id="productPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="productQuantity">Количество</label>
                    <input type="number" id="productQuantity" required>
                </div>
                <div class="form-group">
                    <label for="productCategory">Категория</label>
                    <input type="text" id="productCategory">
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
